name: Publish

# The release tag sets the version: v1.2.3 publishes 1.2.3.
on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, for example 1.2.3'
        required: true
      dry-run:
        description: 'Build and verify, but do not publish'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm Trusted Publishing (OIDC)

jobs:
  publish:
    name: Build, verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # Trusted Publishing needs npm >= 11.15.0. Pinned so a new major cannot outrun Node 22.
      - name: Upgrade npm
        run: npm install --global npm@^12

      - name: Show tool versions
        run: |
          echo "node: $(node --version)"
          echo "npm:  $(npm --version)"

      - name: Install dependencies
        run: npm ci

      - name: Work out the version and the npm tag
        id: version
        # Untrusted input goes through env, never into the shell line.
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            RAW="$RELEASE_TAG"
          else
            RAW="$INPUT_VERSION"
          fi

          VERSION="${RAW#v}"

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Not a valid semantic version: $RAW"
            exit 1
          fi

          # A prerelease goes to "next", never "latest". A lone "-" reads as an option in grep.
          case "$VERSION" in
            *-*) NPM_TAG=next ;;
            *)   NPM_TAG=latest ;;
          esac

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "npm-tag=$NPM_TAG" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (npm tag: $NPM_TAG)"

      - name: Run the full project check
        run: npm run check

      - name: Set the version on every package
        run: npm run set-version -- "${{ steps.version.outputs.version }}"

      - name: Build the production artifact
        run: npm run build

      - name: Verify the packages a consumer would install
        run: npm run verify:package

      - name: Build the tarballs
        run: |
          mkdir -p artifacts
          npm pack \
            -w redproof \
            -w @redproof/eslint \
            -w @redproof/dependency-cruiser \
            -w @redproof/stryker \
            -w @redproof/testing \
            --pack-destination artifacts
          ls -l artifacts

      - name: Upload the tarballs
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs-${{ steps.version.outputs.version }}
          path: artifacts/*.tgz
          retention-days: 30

      - name: Publish to npm
        if: github.event_name == 'release' || github.event.inputs.dry-run == 'false'
        run: |
          for PKG in redproof @redproof/eslint @redproof/dependency-cruiser @redproof/stryker @redproof/testing; do
            echo "Publishing $PKG"
            npm publish -w "$PKG" --tag "${{ steps.version.outputs.npm-tag }}" --provenance
          done

      - name: Report a dry run
        if: github.event_name != 'release' && github.event.inputs.dry-run != 'false'
        run: echo "Dry run finished. Tarballs are attached to this workflow run. Nothing was published."
