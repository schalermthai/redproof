name: Publish

# The release tag sets the version: v1.2.3 publishes 1.2.3.
on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, for example 1.2.3'
        required: true
      dry-run:
        description: 'Build and verify, but do not publish'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm Trusted Publishing (OIDC)

jobs:
  publish:
    name: Build, verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # Trusted Publishing needs npm >= 11.15.0. Pinned so a new major cannot outrun Node 24.
      - name: Upgrade npm
        run: npm install --global npm@^12

      - name: Show tool versions
        run: |
          echo "node: $(node --version)"
          echo "npm:  $(npm --version)"

      - name: Install dependencies
        run: npm ci

      - name: Work out the version and the npm tag
        id: version
        # Untrusted input goes through env, never into the shell line.
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            RAW="$RELEASE_TAG"
          else
            RAW="$INPUT_VERSION"
          fi

          VERSION="${RAW#v}"

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Not a valid semantic version: $RAW"
            exit 1
          fi

          # A prerelease goes to "next", never "latest". A lone "-" reads as an option in grep.
          case "$VERSION" in
            *-*) NPM_TAG=next ;;
            *)   NPM_TAG=latest ;;
          esac

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "npm-tag=$NPM_TAG" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (npm tag: $NPM_TAG)"

      - name: Run the full project check
        run: npm run check

      - name: Set the version on every package
        run: npm run set-version -- "${{ steps.version.outputs.version }}"

      - name: Build the production artifact
        run: npm run build

      - name: Verify the packages a consumer would install
        run: npm run verify:package -- --pack-destination artifacts

      - name: Upload the tarballs
        uses: actions/upload-artifact@v7
        with:
          name: npm-tarballs-${{ steps.version.outputs.version }}
          path: artifacts/*.tgz
          retention-days: 30

      - name: Check npm package readiness
        if: github.event_name == 'release' || github.event.inputs.dry-run == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          MISSING_PACKAGES=()
          for READY_PACKAGE in redproof @redproof/adapter-tck @redproof/eslint @redproof/dependency-cruiser @redproof/stryker @redproof/testing @redproof/knip; do
            if LOOKUP=$(npm view "$READY_PACKAGE" name --json 2>&1); then
              continue
            fi

            case "$LOOKUP" in
              *E404*) MISSING_PACKAGES+=("$READY_PACKAGE") ;;
              *)
                echo "::error title=npm registry lookup failed::Could not confirm whether $READY_PACKAGE exists. This is not a package-bootstrap failure."
                printf '%s\n' "$LOOKUP"
                exit 1
                ;;
            esac
          done

          if [ "${#MISSING_PACKAGES[@]}" -gt 0 ]; then
            echo "::error title=New npm package needs bootstrap::These packages do not exist on npm yet: ${MISSING_PACKAGES[*]}"
            echo
            echo "Action required before this release can continue:"
            echo "Run these commands while signed in to npm with package write access and 2FA."
            echo "1. Download the verified tarballs:"
            echo "   gh run download ${GITHUB_RUN_ID} --repo schalermthai/redproof --name npm-tarballs-${VERSION} --dir artifacts"

            for MISSING_PACKAGE in "${MISSING_PACKAGES[@]}"; do
              TARBALL_STEM="${MISSING_PACKAGE#@}"
              TARBALL_STEM="${TARBALL_STEM/\//-}"
              TARBALL="artifacts/${TARBALL_STEM}-${VERSION}.tgz"
              echo
              echo "2. Bootstrap $MISSING_PACKAGE with the verified tarball:"
              echo "   npm publish \"$TARBALL\" --access public"
              echo "3. Authorize this workflow as its trusted publisher:"
              echo "   npm trust github \"$MISSING_PACKAGE\" --repo schalermthai/redproof --file publish.yml --allow-publish"
            done

            echo
            echo "4. Re-run this workflow. Already-published package versions will be skipped."
            exit 1
          fi

      - name: Publish to npm
        if: github.event_name == 'release' || github.event.inputs.dry-run == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NPM_TAG: ${{ steps.version.outputs.npm-tag }}
        run: |
          set -euo pipefail

          PUBLISHED_PACKAGES=()
          for PKG in redproof @redproof/adapter-tck @redproof/eslint @redproof/dependency-cruiser @redproof/stryker @redproof/testing @redproof/knip; do
            if npm view "${PKG}@${VERSION}" version --json >/dev/null 2>&1; then
              echo "Skipping ${PKG}@${VERSION}: already published"
              continue
            fi

            TARBALL_STEM="${PKG#@}"
            TARBALL_STEM="${TARBALL_STEM/\//-}"
            TARBALL="artifacts/${TARBALL_STEM}-${VERSION}.tgz"

            if [ ! -f "$TARBALL" ]; then
              echo "::error title=Verified tarball missing::$PKG has no verified tarball at $TARBALL. Package verification and this loop disagree about the release inventory."
              exit 1
            fi

            echo "Publishing $PKG from $TARBALL"
            PUBLISH_STATUS=0
            npm publish "$TARBALL" --tag "$NPM_TAG" --provenance || PUBLISH_STATUS=$?

            if [ "$PUBLISH_STATUS" -eq 0 ]; then
              PUBLISHED_PACKAGES+=("$PKG")
              continue
            fi

            echo "::error title=Publication stopped::$PKG could not be published at $VERSION."
            echo
            if [ "${#PUBLISHED_PACKAGES[@]}" -gt 0 ]; then
              echo "This release is now partial. Published in this run: ${PUBLISHED_PACKAGES[*]}"
            else
              echo "Nothing was published in this run."
            fi
            echo
            echo "A permission failure here usually means this workflow is not yet a"
            echo "trusted publisher for $PKG. Package existence was checked before"
            echo "publication began; authorization was not."
            echo
            echo "Run this while signed in to npm with package write access and 2FA:"
            echo "   npm trust github \"$PKG\" --repo schalermthai/redproof --file publish.yml --allow-publish"
            echo
            echo "Then re-run this workflow. Already-published package versions are skipped,"
            echo "so the rerun completes the release rather than repeating it."
            exit 1
          done

      - name: Report a dry run
        if: github.event_name != 'release' && github.event.inputs.dry-run != 'false'
        run: echo "Dry run finished. Tarballs are attached to this workflow run. Nothing was published."
