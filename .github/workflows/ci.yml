name: CI

# Independent confidence layers start together and report their failures separately.
on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality and integration checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      # `npm ci` also proves package.json and package-lock.json still agree.
      - name: Install dependencies
        run: npm ci

      # The @redproof/ruff tests run the real Ruff.
      - name: Install Ruff
        run: pipx install ruff==0.17.5
      # The @redproof/coverage-py native tests run the real tool; they are only
      # registered when this interpreter is found.
      - name: Install coverage.py for the native adapter tests
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Point the native tests at coverage.py
        run: |
          python -m venv "$RUNNER_TEMP/coverage-venv"
          "$RUNNER_TEMP/coverage-venv/bin/python" -m pip install coverage==7.17.3
          echo "REDPROOF_COVERAGE_PY_PYTHON=$RUNNER_TEMP/coverage-venv/bin/python" >> "$GITHUB_ENV"

      # The @redproof/deptry native tests run the real tool, the newest pinned release and the oldest supported
      # one. They are only registered when an interpreter is found, so REDPROOF_DEPTRY_REQUIRED makes a missing one fail.
      - name: Install Python for the native adapter tests
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Point the native tests at deptry
        run: |
          python -m venv "$RUNNER_TEMP/deptry-venv"
          "$RUNNER_TEMP/deptry-venv/bin/python" -m pip install deptry==0.25.1
          python -m venv "$RUNNER_TEMP/deptry-oldest-venv"
          "$RUNNER_TEMP/deptry-oldest-venv/bin/python" -m pip install deptry==0.21.2
          echo "REDPROOF_DEPTRY_PYTHON=$RUNNER_TEMP/deptry-venv/bin/python" >> "$GITHUB_ENV"
          echo "REDPROOF_DEPTRY_PYTHON_OLDEST=$RUNNER_TEMP/deptry-oldest-venv/bin/python" >> "$GITHUB_ENV"
          echo "REDPROOF_DEPTRY_REQUIRED=1" >> "$GITHUB_ENV"

      - name: Run quality and integration checks
        run: npm run check:quality

  # Every Gate file under gates/ becomes one proofs job, so a new Gate cannot
  # miss CI by being absent from a hand-written list.
  discover:
    name: Discover Gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      gates: ${{ steps.list.outputs.gates }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: List the Gate files
        id: list
        run: |
          gates=$(find gates -maxdepth 1 -name '*.ts' | sed 's|^gates/||; s|[.]ts$||' | sort | jq -R . | jq -sc .)
          test "$gates" != '[]'
          echo "gates=$gates" >> "$GITHUB_OUTPUT"

  proofs:
    name: Redproof proofs (${{ matrix.gate }})
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        gate: ${{ fromJSON(needs.discover.outputs.gates) }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The @redproof/coverage-py native tests run the real tool; they are only
      # registered when this interpreter is found.
      - name: Install coverage.py for the native adapter tests
        if: matrix.gate == 'test-health'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Point the native tests at coverage.py
        if: matrix.gate == 'test-health'
        run: |
          python -m venv "$RUNNER_TEMP/coverage-venv"
          "$RUNNER_TEMP/coverage-venv/bin/python" -m pip install coverage==7.17.3
          echo "REDPROOF_COVERAGE_PY_PYTHON=$RUNNER_TEMP/coverage-venv/bin/python" >> "$GITHUB_ENV"

      # The @redproof/deptry native tests run the real tool, the newest pinned release and the oldest supported
      # one. They are only registered when an interpreter is found, so REDPROOF_DEPTRY_REQUIRED makes a missing one fail.
      - name: Install Python for the native adapter tests
        if: matrix.gate == 'test-health'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Point the native tests at deptry
        if: matrix.gate == 'test-health'
        run: |
          python -m venv "$RUNNER_TEMP/deptry-venv"
          "$RUNNER_TEMP/deptry-venv/bin/python" -m pip install deptry==0.25.1
          python -m venv "$RUNNER_TEMP/deptry-oldest-venv"
          "$RUNNER_TEMP/deptry-oldest-venv/bin/python" -m pip install deptry==0.21.2
          echo "REDPROOF_DEPTRY_PYTHON=$RUNNER_TEMP/deptry-venv/bin/python" >> "$GITHUB_ENV"
          echo "REDPROOF_DEPTRY_PYTHON_OLDEST=$RUNNER_TEMP/deptry-oldest-venv/bin/python" >> "$GITHUB_ENV"
          echo "REDPROOF_DEPTRY_REQUIRED=1" >> "$GITHUB_ENV"

      - name: Build the proof runtime
        run: npm run build

      # The test-health Gate runs the @redproof/ruff tests, which run the real Ruff.
      - name: Install Ruff
        run: pipx install ruff==0.17.5

      - name: Run the proofs of one Gate
        run: npm run check:proofs -- gates/${{ matrix.gate }}.ts

  packages:
    name: Package consumer verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Package verification must never read a stale dist.
      - name: Build the production artifact
        run: npm run build

      - name: Verify the packages a consumer would install
        run: npm run verify:package

  # Preserve the established required-check name while the three useful jobs
  # above run and report independently.
  check:
    name: Check and verify
    if: always()
    needs: [quality, proofs, packages]
    runs-on: ubuntu-latest

    steps:
      - name: Require every confidence layer
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          PROOFS_RESULT: ${{ needs.proofs.result }}
          PACKAGES_RESULT: ${{ needs.packages.result }}
        run: |
          if [ "$QUALITY_RESULT" != success ] || [ "$PROOFS_RESULT" != success ] || [ "$PACKAGES_RESULT" != success ]; then
            echo "One or more CI confidence layers did not pass."
            exit 1
          fi
